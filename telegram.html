<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- REDIRECIONAMENTO AUTOMÁTICO - Altere o link abaixo no futuro se trocar de canal -->
    <meta http-equiv="refresh" content="0;url=https://t.me/onlybesthentais">
    <title>Redirecionando para o Telegram...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: #229ed9;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.3);
        }
        .btn:hover {
            background: #1c8adb;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✈️</div>
        <h2>Redirecionando...</h2>
        <p>Você está sendo redirecionado para o nosso canal do Telegram.</p>
        <!-- Altere o href abaixo no futuro se trocar de canal -->
        <a id="redirect-btn" href="https://t.me/onlybesthentais" class="btn">Entrar no Canal</a>
    </div>

    <script>
        // LINK DE DESTINO DO TELEGRAM (Altere o link dentro das aspas quando trocar de canal)
        const targetURL = "https://t.me/onlybesthentais";
        
        // Redirecionamento instantâneo
        window.location.href = targetURL;
    </script>
</body>
</html>
